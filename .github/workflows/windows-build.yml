name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Package portable (unpacked -> zip)
        # Use electron-builder to produce an unpacked distribution (--dir) and avoid publishing
        run: |
          npx electron-builder --win --x64 --dir --publish never
          powershell -Command "Compress-Archive -Path 'dist\\win-unpacked\\*' -DestinationPath 'dist\\ytdownload-portable-win-x64.zip' -Force"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytdownload-windows-artifacts
          path: |
            dist/ytdownload-portable-win-x64.zip
            dist/*.exe
            dist/*.nsis*
